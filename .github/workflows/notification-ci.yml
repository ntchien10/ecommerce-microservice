name: Build Notification Service

on:
  push:
    branches:
      - main
    paths:
      - "services/notification-service/**"
      - ".github/workflows/notification-ci.yml"

jobs:
  build-and-push:
    runs-on: self-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build notification-service
        working-directory: services/notification-service
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: services/notification-service
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:1.0 .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:1.0

      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl rollout restart deployment notification-service
            kubectl rollout status deployment notification-service
